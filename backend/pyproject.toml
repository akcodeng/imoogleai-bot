[project]
name = "imoogle-backend"
version = "5.0.0"
description = "ImoogleAI - The Ultimate Telegram AI Assistant by Imoogle Technology"
requires-python = ">=3.11"
dependencies = [
    # Telegram
    "python-telegram-bot[all]>=21.0",
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.14.0",
    # AI Providers
    "mistralai>=1.2.0",
    "groq>=0.12.0",
    "httpx>=0.28.0",
    "aiohttp>=3.11.0",
    # Voice & Audio
    "elevenlabs>=1.13.0",
    "pydub>=0.25.1",
    # Image Processing
    "pillow>=11.0.0",
    # Payments
    "paystack>=1.6.0",
    # Redis for caching/sessions
    "redis>=5.2.0",
    # Utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.17",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
    "pytz>=2024.2",
    "geopy>=2.4.1",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
